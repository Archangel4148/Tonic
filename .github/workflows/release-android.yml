name: Release Android APK

# Signed release builds for sideload distribution. Requires Android signing secrets.
# Use build-android-debug.yml for everyday dev testing without a keystore.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "27.0.11902837"

jobs:
  apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Require Android signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEY_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::Android release signing secrets are missing."
            echo "Add ANDROID_KEY_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS to the repo secrets."
            echo "See docs/release.md#android-signing-one-time-setup."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project if missing
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci --skip-targets-install
          fi
          # `tauri android init` seeds default Tauri launcher icons into gen/android.
          # Re-run the icon generator so mipmaps land in the Android project res/.
          npm run icons
          # Hide status/nav bars until swipe (immersive sticky).
          npm run android:immersive
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Build universal release APK
        run: npx tauri android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Sign release APK with upload keystore
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned release APK found. APK outputs:"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-artifacts
          ALIGNED="$RUNNER_TEMP/tonic-aligned.apk"
          SIGNED="release-artifacts/Tonic_${VERSION}_universal.apk"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          rm -f "$RUNNER_TEMP/keystore.jks" "$ALIGNED"
          ls -la release-artifacts
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: tonic-android-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
