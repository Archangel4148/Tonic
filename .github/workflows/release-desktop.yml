name: Release desktop

# Prefer tagging vX.Y.Z — CI syncs that version into the project before building.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.2). Required when not running from a tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            bundle: nsis
          - platform: macos-latest
            args: --bundles dmg
            bundle: dmg
          - platform: ubuntu-22.04
            args: --bundles appimage
            bundle: appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="${{ inputs.version }}"
          fi
          if [ -z "$RAW" ]; then
            echo "::error::No version. Push a tag like v1.0.2, or pass workflow_dispatch input 'version'."
            exit 1
          fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply version from tag/input
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          releaseName: "Tonic v${{ steps.ver.outputs.version }}"
          releaseBody: "Desktop installers for this release. See docs/release.md."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/${{ matrix.bundle }}/**/*
            target/release/bundle/${{ matrix.bundle }}/**/*
