[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/domain",
    "crates/app",
    "crates/persist",
    "crates/import",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic-domain = { path = "crates/domain" }
tonic-app = { path = "crates/app" }
tonic-persist = { path = "crates/persist" }
tonic-import = { path = "crates/import" }

[workspace.lints.rust]
unsafe_code = "forbid"
